name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test offline startup, release updates, and browser lifecycle
        run: node --test scripts/test-offline.mjs scripts/test-page-visibility.mjs scripts/test-viewport-recovery.mjs

      - name: Run JVM tests
        run: xvfb-run --auto-servernum ./gradlew :shared:jvmTest --console=plain

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    # Serialize updates to the shared deployment branch.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web app (Wasm)
        run: ./gradlew :webApp:wasmJsBrowserDistribution --console=plain

      - name: Prepare Pages output
        run: touch webApp/build/dist/wasmJs/productionExecutable/.nojekyll

      # Fork pull requests have a read-only token. Still build them, without publishing.
      - name: Deploy to Pages branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: deployment
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: webApp/build/dist/wasmJs/productionExecutable
          target-folder: ${{ github.event_name == 'pull_request' && format('pr-preview/pr-{0}', github.event.pull_request.number) || '' }}
          clean-exclude: |
            pr-preview/
            CNAME
          force: false

      - name: Report deployment URL
        if: steps.deployment.outcome == 'success'
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          url="${url%/}/"
          if [ -n "$PR_NUMBER" ]; then
            url="${url}pr-preview/pr-$PR_NUMBER/"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
